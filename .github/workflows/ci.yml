name: ML Pipeline CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Check for syntax and undefined-name errors (Ruff)
        run: ruff check src/ tests/ --select E9,F63,F7,F82

      - name: Run unit and pipeline tests (Pytest)
        run: pytest -v
  
  docker-build:
    name: Verify Docker Build
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure models directory exists for Docker COPY
        run: mkdir -p models

      - name: Build Docker image
        run: docker build -t churn-api:ci .


